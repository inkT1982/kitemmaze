<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Runner: Toggle Edition</title>
    <style>
        :root { --void: #020617; --pipe: #1e293b; --accent: #38bdf8; --trap: #560319; --win: #4ade80; }
        body {
            margin: 0; background: var(--void); color: white;
            font-family: system-ui, sans-serif; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        canvas {
            background: #000; border: 3px solid var(--pipe);
            border-radius: 15px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
            max-height: 70vh; max-width: 90vw; transition: filter 0.2s;
        }
        .header { text-align: center; margin-bottom: 10px; }
        #status { font-size: 1.8rem; font-weight: bold; margin: 0; text-shadow: 0 0 10px var(--accent); }
        .intro { font-size: 0.85rem; color: #94a3b8; margin: 5px 0; }
        
        .ui { margin-top: 15px; display: flex; gap: 15px; }
        button {
            padding: 15px 35px; background: var(--pipe); border: 2px solid var(--accent);
            color: white; border-radius: 50px; font-weight: bold; cursor: pointer; min-width: 120px;
        }
        /* Style for PAUSE state */
        button.playing {
            background: #0f172a; border-color: #ef4444; color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
        
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="status">Pipe Runner</h1>
        <p class="intro">Tilt to roll. Avoid scarlet traps!</p>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="ui">
        <button id="toggleBtn">PLAY</button>
        <button onclick="resetMaze()">NEW MAZE</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        
        const COLS = 13, ROWS = 19, TILE = 25;
        canvas.width = COLS * TILE; canvas.height = ROWS * TILE;

        let maze = [], traps = [], particles = [], ball = { x: 0, y: 0, radius: 8, vx: 0, vy: 0 };
        let tilt = { x: 0, y: 0 }, goal = { x: 0, y: 0 }, isPlaying = false, timeScale = 1;

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, type, duration, vol, endFreq = null) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function generateMaze() {
            maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
            const stack = [{x: 1, y: 1}]; maze[1][1] = 0;
            const paths = [];
            while (stack.length > 0) {
                const curr = stack[stack.length - 1];
                const neighbors = [[0,2],[0,-2],[2,0],[-2,0]]
                    .map(([dx, dy]) => ({x: curr.x + dx, y: curr.y + dy, dx, dy}))
                    .filter(n => n.x > 0 && n.x < COLS-1 && n.y > 0 && n.y < ROWS-1 && maze[n.y][n.x] === 1)
                    .sort(() => Math.random() - 0.5);
                if (neighbors.length > 0) {
                    const next = neighbors[0];
                    maze[next.y - next.dy/2][next.x - next.dx/2] = 0;
                    maze[next.y][next.x] = 0;
                    paths.push({x: next.x, y: next.y});
                    stack.push(next);
                } else stack.pop();
            }
            traps = [];
            for(let i=0; i<4; i++) {
                let p = paths[Math.floor(Math.random() * paths.length)];
                traps.push({ x: p.x * TILE + TILE/2, y: p.y * TILE + TILE/2 });
            }
            ball.x = TILE * 1.5; ball.y = TILE * 1.5; ball.vx = 0; ball.vy = 0;
            goal = { x: (COLS - 2) * TILE + TILE/2, y: (ROWS - 2) * TILE + TILE/2 };
            particles = []; timeScale = 1;
        }

        function triggerVictory() {
            isPlaying = false;
            toggleBtn.innerText = "PLAY";
            toggleBtn.classList.remove('playing');
            timeScale = 0.1;
            statusEl.innerText = "⭐ LEGENDARY ⭐";
            statusEl.style.color = "var(--win)";
            canvas.classList.add('shake');
            playSound(200, 'sine', 1, 0.2, 800); 
            for(let i=0; i<60; i++) {
                particles.push({
                    x: ball.x, y: ball.y,
                    vx: (Math.random()-0.5) * 15, vy: (Math.random()-0.5) * 15,
                    size: Math.random() * 5 + 2,
                    color: `hsl(${Math.random()*360}, 100%, 60%)`, life: 1
                });
            }
            setTimeout(() => { canvas.classList.remove('shake'); timeScale = 1; }, 1000);
        }

        function triggerTrap() {
            canvas.style.filter = "invert(1) brightness(2)";
            playSound(600, 'sawtooth', 0.3, 0.1, 50);
            let rx, ry;
            do {
                rx = Math.floor(Math.random() * COLS);
                ry = Math.floor(Math.random() * ROWS);
            } while (maze[ry][rx] !== 0);
            ball.x = rx * TILE + TILE/2; ball.y = ry * TILE + TILE/2;
            ball.vx = 0; ball.vy = 0;
            setTimeout(() => canvas.style.filter = "", 150);
        }

        function update() {
            if (isPlaying) {
                ball.vx = (ball.vx + tilt.x * 0.45) * 0.93;
                ball.vy = (ball.vy + tilt.y * 0.45) * 0.93;
                
                let nx = ball.x + (ball.vx * timeScale);
                let ny = ball.y + (ball.vy * timeScale);

                if (!isWall(nx, ball.y)) ball.x = nx; else ball.vx *= -0.5;
                if (!isWall(ball.x, ny)) ball.y = ny; else ball.vy *= -0.5;

                traps.forEach(t => {
                    if (Math.hypot(ball.x - t.x, ball.y - t.y) < ball.radius * 1.2) triggerTrap();
                });

                if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < ball.radius * 1.5) triggerVictory();
            }

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.015; });
            particles = particles.filter(p => p.life > 0);

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
            for (let y=0; y<ROWS; y++) {
                for (let x=0; x<COLS; x++) {
                    if (maze[y][x] === 0) { ctx.fillStyle = '#111827'; ctx.fillRect(x*TILE, y*TILE, TILE, TILE); }
                }
            }
            traps.forEach(t => {
                ctx.fillStyle = '#560319'; ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * 1.3, 0, Math.PI*2); ctx.fill();
            });

            const pulse = 0.4 + Math.sin(Date.now()/500) * 0.15;
            ctx.fillStyle = `rgba(74, 222, 128, ${pulse})`;
            ctx.beginPath(); ctx.arc(goal.x, goal.y, ball.radius * 2, 0, Math.PI*2); ctx.fill();

            const grad = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, ball.radius);
            grad.addColorStop(0, '#7dd3fc'); grad.addColorStop(1, '#0369a1');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();

            particles.forEach(p => {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function isWall(px, py) {
            const b = ball.radius - 1;
            return [{x:px-b, y:py-b},{x:px+b, y:py-b},{x:px-b, y:py+b},{x:px+b, y:py+b}]
                   .some(p => {
                       let gx = Math.floor(p.x/TILE), gy = Math.floor(p.y/TILE);
                       return !maze[gy] || maze[gy][gx] === 1;
                   });
        }

        async function toggleHandler() {
            initAudio();
            
            // Screen Lock Logic
            try {
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('portrait').catch(()=>{});
                }
            } catch (e) {}

            // Permissions Logic
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') startSensors();
            } else {
                startSensors();
            }

            // Toggle Behavior
            isPlaying = !isPlaying;
            if (isPlaying) {
                toggleBtn.innerText = "PAUSE";
                toggleBtn.classList.add('playing');
                statusEl.innerText = "ROLLING...";
            } else {
                toggleBtn.innerText = "PLAY";
                toggleBtn.classList.remove('playing');
                statusEl.innerText = "PAUSED";
            }
        }

        function startSensors() {
            window.addEventListener('deviceorientation', e => {
                tilt.x = e.gamma * 0.12; tilt.y = e.beta * 0.12;
            });
        }

        function resetMaze() { 
            generateMaze(); 
            statusEl.innerText = "PIPE RUNNER"; 
            statusEl.style.color = "white"; 
            isPlaying = false;
            toggleBtn.innerText = "PLAY";
            toggleBtn.classList.remove('playing');
        }

        toggleBtn.addEventListener('click', toggleHandler);
        generateMaze(); update();
    </script>
</body>
</html>
