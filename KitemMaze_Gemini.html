<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Runner Maze</title>
    <style>
        :root {
            --void-color: #020617;
            --pipe-color: #1e293b;
            --highlight: #334155;
            --ball-color: #38bdf8;
        }

        body {
            margin: 0;
            background: var(--void-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .header { padding: 20px 0 10px; text-align: center; }
        
        /* Deep/Tall Gaming Area */
        #maze-container {
            display: grid;
            background: var(--void-color);
            padding: 10px;
            /* Height increased for a deeper feel */
            height: 70vh; 
            aspect-ratio: 2/3;
            border: 4px solid #1e293b;
            border-radius: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .cell {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Pipe Path Styling */
        .path {
            background: linear-gradient(145deg, var(--pipe-color), var(--highlight));
            border-radius: 4px; /* Slight roundness for pipe look */
        }

        /* 3D Ball */
        .player { 
            z-index: 10;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #7dd3fc, #0ea5e9, #0369a1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            transform: scale(0.85);
        }

        .goal {
            background: radial-gradient(circle at center, #4ade80, #166534);
            box-shadow: 0 0 20px #22c55e;
            border-radius: 50%;
            transform: scale(0.7);
        }

        .ui-panel {
            margin-top: auto;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 18px;
            background: #1e293b;
            border: 2px solid var(--ball-color);
            color: white;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        button:active { background: var(--ball-color); color: var(--void-color); }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="status" style="margin:0">Pipe Runner</h2>
    </div>

    <div id="maze-container"></div>

    <div class="ui-panel">
        <button onclick="initGyro()">Enable Tilt</button>
        <button onclick="generateNewMaze()">New Pipe Maze</button>
    </div>

    <script>
        const ROWS = 15; // Increased height
        const COLS = 9;
        let maze = [];
        let player = { x: 1, y: 1 };
        let lastMove = 0;

        function generateNewMaze() {
            // Initialize empty grid (all walls)
            maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
            
            // Simple DFS Maze Generation
            const stack = [{x: 1, y: 1}];
            maze[1][1] = 0;

            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const dirs = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
                let carved = false;

                for (let [dx, dy] of dirs) {
                    let nx = current.x + dx;
                    let ny = current.y + dy;
                    if (nx > 0 && nx < COLS-1 && ny > 0 && ny < ROWS-1 && maze[ny][nx] === 1) {
                        maze[ny - dy/2][nx - dx/2] = 0;
                        maze[ny][nx] = 0;
                        stack.push({x: nx, y: ny});
                        carved = true;
                        break;
                    }
                }
                if (!carved) stack.pop();
            }

            // Set Player and Goal
            player = { x: 1, y: 1 };
            maze[1][1] = 2;
            maze[ROWS-2][COLS-2] = 3;
            render();
            document.getElementById('status').innerText = "Reach the green valve!";
        }

        function render() {
            const container = document.getElementById('maze-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

            maze.forEach((row, y) => {
                row.forEach((cell, x) => {
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (cell === 0) div.classList.add('path');
                    if (cell === 2) div.classList.add('path', 'player');
                    if (cell === 3) div.classList.add('path', 'goal');
                    container.appendChild(div);
                });
            });
        }

        function move(dx, dy) {
            const now = Date.now();
            if (now - lastMove < 180) return;

            let nx = player.x + dx;
            let ny = player.y + dy;

            if (maze[ny] && maze[ny][nx] !== 1) {
                if (maze[ny][nx] === 3) document.getElementById('status').innerText = "Pipe Cleared! 🏆";
                maze[player.y][player.x] = 0;
                player = { x: nx, y: ny };
                maze[player.y][player.x] = 2;
                lastMove = now;
                render();
            }
        }

        async function initGyro() {
            try {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const state = await DeviceOrientationEvent.requestPermission();
                    if (state === 'granted') window.addEventListener('deviceorientation', handleGyro);
                } else {
                    window.addEventListener('deviceorientation', handleGyro);
                }
                // Try locking screen
                document.documentElement.requestFullscreen().then(() => {
                    screen.orientation.lock('portrait-primary').catch(()=>{});
                });
            } catch (e) { alert("Gyro access requires a secure connection."); }
        }

        function handleGyro(e) {
            if (e.beta > 15) move(0, 1);
            else if (e.beta < -15) move(0, -1);
            if (e.gamma > 15) move(1, 0);
            else if (e.gamma < -15) move(-1, 0);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowUp") move(0, -1);
            if (e.key === "ArrowDown") move(0, 1);
            if (e.key === "ArrowLeft") move(-1, 0);
            if (e.key === "ArrowRight") move(1, 0);
        });

        generateNewMaze();
    </script>
</body>
</html>
