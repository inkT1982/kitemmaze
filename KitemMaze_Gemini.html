<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smooth Pipe Runner</title>
    <style>
        :root {
            --void: #020617;
            --pipe: #1e293b;
            --highlight: #334155;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            background: var(--void);
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-canvas {
            background: var(--void);
            border: 2px solid var(--pipe);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-height: 75vh;
            max-width: 90vw;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            background: var(--pipe);
            border: 2px solid var(--accent);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2 id="status" style="margin-bottom: 10px;">Tilt to Roll</h2>
    <canvas id="game-canvas"></canvas>

    <div class="controls">
        <button onclick="initApp()">Start / Enable Tilt</button>
        <button onclick="resetMaze()">Generate New</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // Settings: 20% more complex than before
        const COLS = 13; 
        const ROWS = 19;
        const TILE_SIZE = 25; // Smaller tiles for "zoom out" effect
        
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        let maze = [];
        let ball = { x: 0, y: 0, radius: 8, vx: 0, vy: 0 };
        let tilt = { x: 0, y: 0 };
        let goal = { x: 0, y: 0 };

        function generateMaze() {
            maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
            const stack = [{x: 1, y: 1}];
            maze[1][1] = 0;

            while (stack.length > 0) {
                const curr = stack[stack.length - 1];
                const neighbors = [[0,2],[0,-2],[2,0],[-2,0]]
                    .map(([dx, dy]) => ({x: curr.x + dx, y: curr.y + dy, dx, dy}))
                    .filter(n => n.x > 0 && n.x < COLS-1 && n.y > 0 && n.y < ROWS-1 && maze[n.y][n.x] === 1)
                    .sort(() => Math.random() - 0.5);

                if (neighbors.length > 0) {
                    const next = neighbors[0];
                    maze[next.y - next.dy/2][next.x - next.dx/2] = 0;
                    maze[next.y][next.x] = 0;
                    stack.push(next);
                } else {
                    stack.pop();
                }
            }
            ball.x = TILE_SIZE * 1.5;
            ball.y = TILE_SIZE * 1.5;
            ball.vx = 0;
            ball.vy = 0;
            goal = { x: (COLS - 2) * TILE_SIZE + TILE_SIZE/2, y: (ROWS - 2) * TILE_SIZE + TILE_SIZE/2 };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Pipes
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === 0) {
                        ctx.fillStyle = '#1e293b';
                        ctx.beginPath();
                        ctx.roundRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE, 4);
                        ctx.fill();
                    }
                }
            }

            // Draw Goal
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Ball (Full Circle with 3D gradient)
            const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.radius);
            grad.addColorStop(0, '#7dd3fc');
            grad.addColorStop(1, '#0369a1');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            ball.vx = (ball.vx + tilt.x * 0.4) * 0.92; // Smooth acceleration + friction
            ball.vy = (ball.vy + tilt.y * 0.4) * 0.92;

            let nextX = ball.x + ball.vx;
            let nextY = ball.y + ball.vy;

            // Simple collision
            if (!isWall(nextX, ball.y)) ball.x = nextX; else ball.vx *= -0.4;
            if (!isWall(ball.x, nextY)) ball.y = nextY; else ball.vy *= -0.4;

            // Check Win
            const dist = Math.hypot(ball.x - goal.x, ball.y - goal.y);
            if (dist < ball.radius * 1.5) {
                document.getElementById('status').innerText = "Winner! 🎉";
            }

            draw();
            requestAnimationFrame(update);
        }

        function isWall(px, py) {
            const buffer = ball.radius - 1;
            const points = [
                {x: px - buffer, y: py - buffer},
                {x: px + buffer, y: py - buffer},
                {x: px - buffer, y: py + buffer},
                {x: px + buffer, y: py + buffer}
            ];
            return points.some(p => {
                const gx = Math.floor(p.x / TILE_SIZE);
                const gy = Math.floor(p.y / TILE_SIZE);
                return !maze[gy] || maze[gy][gx] === 1;
            });
        }

        async function initApp() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') window.addEventListener('deviceorientation', e => {
                    tilt.x = e.gamma * 0.1;
                    tilt.y = e.beta * 0.1;
                });
            } else {
                window.addEventListener('deviceorientation', e => {
                    tilt.x = e.gamma * 0.1;
                    tilt.y = e.beta * 0.1;
                });
            }
            document.documentElement.requestFullscreen().catch(()=>{});
        }

        function resetMaze() {
            generateMaze();
            document.getElementById('status').innerText = "Tilt to Roll";
        }

        generateMaze();
        update();
    </script>
</body>
</html>
