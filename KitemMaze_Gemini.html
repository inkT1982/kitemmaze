<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Runner: Modern Seamless</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --pipe: #1e293b; 
            --accent: #2dd4bf; 
            --trap: #991b1b; 
            --win: #a3e635; 
        }

        body {
            margin: 0; background: var(--bg); color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        canvas {
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-height: 60vh; max-width: 90vw;
        }

        .header { text-align: center; margin-bottom: 20px; padding: 0 20px; }
        #status { 
            font-size: 1.8rem; font-weight: 800; letter-spacing: 0.05em; margin: 0;
            background: linear-gradient(to right, #2dd4bf, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .intro { 
            font-size: 0.9rem; color: #94a3b8; margin-top: 8px; 
            font-weight: 400; line-height: 1.4; max-width: 300px; margin-left: auto; margin-right: auto;
        }
        
        .ui { margin-top: 25px; display: flex; gap: 12px; }
        button {
            padding: 14px 28px; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: #f1f5f9; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; backdrop-filter: blur(5px); min-width: 120px;
        }

        button#toggleBtn.playing { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.05); }
        button:active { transform: scale(0.95); }

        .flash { animation: flashbang 0.5s ease-out; }
        @keyframes flashbang {
            0% { filter: brightness(8); transform: scale(1.05); }
            100% { filter: brightness(1); transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="status">PIPE RUNNER</h1>
        <p class="intro">Tilt your phone to roll the ball and reach the destination</p>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="ui">
        <button id="toggleBtn">PLAY</button>
        <button onclick="resetMaze()">GENERATE</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        
        const COLS = 13, ROWS = 19, TILE = 25;
        canvas.width = COLS * TILE; canvas.height = ROWS * TILE;

        let maze = [], traps = [], fireworks = [], ball = { x: 0, y: 0, radius: 7, vx: 0, vy: 0 };
        let tilt = { x: 0, y: 0 }, goal = { x: 0, y: 0 }, isPlaying = false;

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, type, duration, vol, endFreq = null) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function generateMaze() {
            maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
            const stack = [{x: 1, y: 1}]; maze[1][1] = 0;
            const paths = [];
            while (stack.length > 0) {
                const curr = stack[stack.length - 1];
                const neighbors = [[0,2],[0,-2],[2,0],[-2,0]].map(([dx, dy]) => ({x: curr.x + dx, y: curr.y + dy, dx, dy}))
                    .filter(n => n.x > 0 && n.x < COLS-1 && n.y > 0 && n.y < ROWS-1 && maze[n.y][n.x] === 1)
                    .sort(() => Math.random() - 0.5);
                if (neighbors.length > 0) {
                    const next = neighbors[0];
                    maze[next.y - next.dy/2][next.x - next.dx/2] = 0; maze[next.y][next.x] = 0;
                    paths.push({x: next.x, y: next.y}); stack.push(next);
                } else stack.pop();
            }
            traps = [];
            for(let i=0; i<4; i++) {
                let p = paths[Math.floor(Math.random() * paths.length)];
                traps.push({ x: p.x * TILE + TILE/2, y: p.y * TILE + TILE/2 });
            }
            ball.x = TILE * 1.5; ball.y = TILE * 1.5; ball.vx = 0; ball.vy = 0;
            goal = { x: (COLS - 2) * TILE + TILE/2, y: (ROWS - 2) * TILE + TILE/2 };
            fireworks = [];
        }

        function createFirework(x, y) {
            for(let i=0; i<120; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                fireworks.push({
                    x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1, size: Math.random() * 3 + 1,
                    color: i % 2 === 0 ? '#2dd4bf' : '#a3e635', gravity: 0.15
                });
            }
        }

        function triggerVictory() {
            isPlaying = false;
            toggleBtn.innerText = "PLAY";
            toggleBtn.classList.remove('playing');
            statusEl.innerText = "SUCCESS";
            canvas.classList.add('flash');
            playSound(300, 'sine', 0.5, 0.1, 1000);
            createFirework(goal.x, goal.y);
            setTimeout(() => {
                createFirework(goal.x - 25, goal.y - 25);
                createFirework(goal.x + 25, goal.y - 25);
                playSound(200, 'square', 0.3, 0.05);
            }, 250);
            setTimeout(() => canvas.classList.remove('flash'), 500);
        }

        function triggerTrap() {
            canvas.style.filter = "brightness(0.4) sepia(1) hue-rotate(-60deg)";
            playSound(400, 'sawtooth', 0.2, 0.1, 40);
            let rx, ry;
            do { rx = Math.floor(Math.random() * COLS); ry = Math.floor(Math.random() * ROWS); } while (maze[ry][rx] !== 0);
            ball.x = rx * TILE + TILE/2; ball.y = ry * TILE + TILE/2;
            ball.vx = 0; ball.vy = 0;
            setTimeout(() => canvas.style.filter = "", 200);
        }

        function update() {
            if (isPlaying) {
                ball.vx = (ball.vx + tilt.x * 0.45) * 0.93;
                ball.vy = (ball.vy + tilt.y * 0.45) * 0.93;
                let nx = ball.x + ball.vx, ny = ball.y + ball.vy;
                if (!isWall(nx, ball.y)) ball.x = nx; else ball.vx *= -0.4;
                if (!isWall(ball.x, ny)) ball.y = ny; else ball.vy *= -0.4;
                traps.forEach(t => {
                    if (Math.hypot(ball.x - t.x, ball.y - t.y) < ball.radius * 1.2) triggerTrap();
                });
                if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < ball.radius * 1.5) triggerVictory();
            }
            fireworks.forEach(f => { f.x += f.vx; f.y += f.vy; f.vy += f.gravity; f.life -= 0.012; });
            fireworks = fireworks.filter(f => f.life > 0);
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Continuous Pipes with 3D Indent effect
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            
            // 1. Darker Outer Stroke (Inner Shadow effect)
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = TILE - 2;
            drawPipes();

            // 2. Main Pipe Fill
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = TILE - 6;
            drawPipes();

            // Traps
            traps.forEach(t => {
                ctx.fillStyle = '#991b1b';
                ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * 1.1, 0, Math.PI*2); ctx.fill();
            });

            // Goal
            const pulse = 0.5 + Math.sin(Date.now()/700) * 0.2;
            ctx.shadowBlur = 20; ctx.shadowColor = '#a3e635';
            ctx.fillStyle = `rgba(163, 230, 53, ${pulse})`;
            ctx.beginPath(); ctx.arc(goal.x, goal.y, ball.radius * 2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Player
            const grad = ctx.createRadialGradient(ball.x-2, ball.y-2, 1, ball.x, ball.y, ball.radius);
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#94a3b8');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();

            // Fireworks
            fireworks.forEach(f => {
                ctx.globalAlpha = f.life; ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawPipes() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === 0) {
                        const px = x * TILE + TILE/2;
                        const py = y * TILE + TILE/2;
                        [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dx, dy]) => {
                            let nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && maze[ny][nx] === 0) {
                                ctx.beginPath();
                                ctx.moveTo(px, py);
                                ctx.lineTo(nx * TILE + TILE/2, ny * TILE + TILE/2);
                                ctx.stroke();
                            }
                        });
                        // Center Cap
                        ctx.beginPath(); ctx.arc(px, py, ctx.lineWidth/2, 0, Math.PI*2); ctx.fill();
                    }
                }
            }
        }

        function isWall(px, py) {
            const b = ball.radius - 1;
            return [{x:px-b, y:py-b},{x:px+b, y:py-b},{x:px-b, y:py+b},{x:px+b, y:py+b}].some(p => {
                let gx = Math.floor(p.x/TILE), gy = Math.floor(p.y/TILE);
                return !maze[gy] || maze[gy][gx] === 1;
            });
        }

        async function toggleHandler() {
            initAudio();
            try {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait').catch(()=>{});
            } catch (e) {}
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') startSensors();
            } else startSensors();

            isPlaying = !isPlaying;
            toggleBtn.innerText = isPlaying ? "PAUSE" : "PLAY";
            if (isPlaying) toggleBtn.classList.add('playing');
            else toggleBtn.classList.remove('playing');
        }

        function startSensors() { window.addEventListener('deviceorientation', e => { tilt.x = e.gamma * 0.12; tilt.y = e.beta * 0.12; }); }
        function resetMaze() { generateMaze(); isPlaying = false; toggleBtn.innerText = "PLAY"; toggleBtn.classList.remove('playing'); statusEl.innerText = "PIPE RUNNER"; }

        toggleBtn.addEventListener('click', toggleHandler);
        generateMaze(); update();
    </script>
</body>
</html>
