<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Runner: Glass Floor</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --accent: #3b82f6; 
        }

        body {
            margin: 0; background: var(--bg); color: #f1f5f9;
            font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
            perspective: 1200px;
            /* Background gradient that shows through the glass floor */
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #080c14 100%);
        }

        .header { text-align: center; margin-bottom: 20px; z-index: 10; }
        #status { 
            font-size: 1.6rem; font-weight: 800; margin: 0;
            background: linear-gradient(to right, #2dd4bf, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .game-wrapper {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(30deg) rotateZ(-10deg);
            transition: transform 0.5s ease;
        }

        canvas {
            /* This makes the "Base" transparent */
            background: rgba(30, 41, 59, 0.4); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            /* Glassmorphism effect */
            backdrop-filter: blur(4px);
            box-shadow: 
                20px 30px 50px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,255,255,0.05);
            max-height: 65vh; max-width: 90vw;
        }

        .ui { margin-top: 40px; display: flex; gap: 12px; z-index: 10; }
        button {
            padding: 14px 28px; background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: #f1f5f9; border-radius: 12px; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Hole/Portal Pulsing Effect */
        @keyframes portalGlow {
            0% { box-shadow: 0 0 10px #3b82f6; }
            50% { box-shadow: 0 0 30px #3b82f6; }
            100% { box-shadow: 0 0 10px #3b82f6; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="status">PIPE RUNNER</h1>
        <div id="layer-text" style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">FLOOR 1: THE SURFACE</div>
    </div>

    <div class="game-wrapper">
        <canvas id="game-canvas"></canvas>
    </div>

    <div class="ui">
        <button id="toggleBtn">PLAY</button>
        <button onclick="resetGame()">RESET</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        
        const COLS = 13, ROWS = 19, TILE = 29; 
        canvas.width = COLS * TILE; canvas.height = ROWS * TILE;

        let maze = [], traps = [], ball = { x: 0, y: 0, radius: 8, vx: 0, vy: 0 };
        let tilt = { x: 0, y: 0 }, goal = { x: 0, y: 0 }, isPlaying = false;
        let currentLayer = 1;

        function generateMaze(layer) {
            maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
            const stack = [{x: 1, y: 1}]; maze[1][1] = 0;
            const paths = [];
            
            while (stack.length > 0) {
                const curr = stack[stack.length - 1];
                const neighbors = [[0,2],[0,-2],[2,0],[-2,0]].map(([dx, dy]) => ({x: curr.x + dx, y: curr.y + dy, dx, dy}))
                    .filter(n => n.x > 0 && n.x < COLS-1 && n.y > 0 && n.y < ROWS-1 && maze[n.y][n.x] === 1)
                    .sort(() => Math.random() - 0.5);
                if (neighbors.length > 0) {
                    const next = neighbors[0];
                    maze[next.y - next.dy/2][next.x - next.dx/2] = 0; maze[next.y][next.x] = 0;
                    paths.push({x: next.x, y: next.y}); stack.push(next);
                } else stack.pop();
            }

            traps = [];
            const trapCount = layer === 1 ? 4 : 8;
            for(let i=0; i < trapCount; i++) {
                let p = paths[Math.floor(Math.random() * paths.length)];
                traps.push({ x: p.x * TILE + TILE/2, y: p.y * TILE + TILE/2 });
            }

            ball.x = TILE * 1.5; ball.y = TILE * 1.5; ball.vx = 0; ball.vy = 0;
            goal = { x: (COLS - 2) * TILE + TILE/2, y: (ROWS - 2) * TILE + TILE/2 };
        }

        function update() {
            if (isPlaying) {
                ball.vx = (ball.vx + tilt.x * 0.45) * 0.93;
                ball.vy = (ball.vy + tilt.y * 0.45) * 0.93;
                let nx = ball.x + ball.vx, ny = ball.y + ball.vy;
                if (!isWall(nx, ball.y)) ball.x = nx; else ball.vx *= -0.4;
                if (!isWall(ball.x, ny)) ball.y = ny; else ball.vy *= -0.4;

                traps.forEach(t => {
                    if (Math.hypot(ball.x - t.x, ball.y - t.y) < ball.radius * 1.2) {
                        ball.x = TILE * 1.5; ball.y = TILE * 1.5;
                    }
                });

                if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < ball.radius * 1.5) {
                    if(currentLayer === 1) {
                        currentLayer = 2;
                        document.getElementById('layer-text').innerText = "FLOOR 2: THE VAULT";
                        generateMaze(2);
                    } else {
                        isPlaying = false;
                        statusEl.innerText = "MISSION CLEAR";
                    }
                }
            }
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Pipes (Solid, not transparent)
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.strokeStyle = currentLayer === 1 ? '#1e293b' : '#0a0f1a';
            ctx.lineWidth = TILE - 4;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (maze[y][x] === 0) {
                        const px = x * TILE + TILE/2, py = y * TILE + TILE/2;
                        [[0,1],[1,0]].forEach(([dx, dy]) => {
                            let nx = x + dx, ny = y + dy;
                            if (nx < COLS && ny < ROWS && maze[ny][nx] === 0) {
                                ctx.moveTo(px, py); ctx.lineTo(nx * TILE + TILE/2, ny * TILE + TILE/2);
                            }
                        });
                        ctx.moveTo(px, py); ctx.lineTo(px, py);
                    }
                }
            }
            ctx.stroke();

            // Goal
            ctx.fillStyle = currentLayer === 1 ? '#3b82f6' : '#a3e635';
            ctx.beginPath(); ctx.arc(goal.x, goal.y, ball.radius * 2, 0, Math.PI*2); ctx.fill();

            // Traps
            ctx.fillStyle = '#ef4444';
            traps.forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2); ctx.fill(); });

            // Ball
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        function isWall(px, py) {
            const b = ball.radius - 2;
            return [{x:px-b, y:py-b},{x:px+b, y:py-b},{x:px-b, y:py+b},{x:px+b, y:py+b}].some(p => {
                let gx = Math.floor(p.x/TILE), gy = Math.floor(p.y/TILE);
                return !maze[gy] || maze[gy][gx] === 1;
            });
        }

        function resetGame() { currentLayer = 1; generateMaze(1); isPlaying = false; }
        
        toggleBtn.addEventListener('click', () => {
            if (statusEl.innerText === "MISSION CLEAR") location.reload();
            isPlaying = !isPlaying;
            toggleBtn.innerText = isPlaying ? "PAUSE" : "PLAY";
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        });

        window.addEventListener('deviceorientation', e => { tilt.x = e.gamma * 0.12; tilt.y = e.beta * 0.12; });

        generateMaze(1); update();
    </script>
</body>
</html>
