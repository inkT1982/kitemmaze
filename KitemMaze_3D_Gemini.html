<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pipe Runner: Sphere 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --bg: #0f172a; --accent: #2dd4bf; }
        body {
            margin: 0; background: var(--bg); color: #f1f5f9;
            font-family: 'Inter', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        #ui-layer {
            position: absolute; top: 20px; text-align: center; z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 40px; display: flex; gap: 15px; z-index: 10;
        }
        h1 { font-size: 1.5rem; letter-spacing: 0.1em; margin: 0; color: var(--accent); }
        .intro { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }
        button {
            padding: 12px 25px; background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); color: white;
            border-radius: 12px; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(10px); pointer-events: auto;
        }
        button.playing { border-color: #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1 id="status">SPHERE RUNNER</h1>
        <p class="intro">Tilt to rotate the world. Reach the green pole.</p>
    </div>

    <div id="controls">
        <button id="toggleBtn">PLAY</button>
        <button onclick="location.reload()">NEW WORLD</button>
    </div>

    <script>
        let scene, camera, renderer, globe, ball, goal;
        let isPlaying = false;
        let rotationTarget = { x: 0, y: 0 };
        const BALL_RADIUS = 0.05;
        const GLOBE_RADIUS = 2;

        // Maze Generation logic wrapped for Sphere
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 5, 5).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 2));

            // Create Globe
            const geometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
            const material = new THREE.MeshPhongMaterial({ color: 0x1e293b, transparent: true, opacity: 0.9 });
            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // Add "Pipes" (Wireframe overlay for the maze)
            const wireGeometry = new THREE.SphereGeometry(GLOBE_RADIUS + 0.01, 32, 32);
            const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x2dd4bf, wireframe: true, transparent: true, opacity: 0.2 });
            const grid = new THREE.Mesh(wireGeometry, wireMaterial);
            globe.add(grid);

            // Ball
            const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
            const ballMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x3b82f6 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(0, GLOBE_RADIUS + BALL_RADIUS, 0);
            scene.add(ball);

            // Goal
            const goalGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.5, 32);
            const goalMat = new THREE.MeshBasicMaterial({ color: 0xa3e635 });
            goal = new THREE.Mesh(goalGeo, goalMat);
            // Place goal on the opposite side
            goal.position.set(0, -(GLOBE_RADIUS), 0);
            globe.add(goal);

            camera.position.z = 5;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Smoothly rotate globe based on tilt
                globe.rotation.x += (rotationTarget.x - globe.rotation.x) * 0.05;
                globe.rotation.y += (rotationTarget.y - globe.rotation.y) * 0.05;

                // Win check (simplified for 3D distance)
                const ballWorldPos = new THREE.Vector3();
                ball.getWorldPosition(ballWorldPos);
                const goalWorldPos = new THREE.Vector3();
                goal.getWorldPosition(goalWorldPos);

                if (ballWorldPos.distanceTo(goalWorldPos) < 0.3) {
                    document.getElementById('status').innerText = "SUCCESS!";
                    isPlaying = false;
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Controls
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res !== 'granted') return;
            }

            isPlaying = !isPlaying;
            toggleBtn.innerText = isPlaying ? "PAUSE" : "PLAY";
            toggleBtn.className = isPlaying ? "playing" : "";
            
            // Lock Screen Rotation (Simulated by handling orientation)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        });

        window.addEventListener('deviceorientation', (e) => {
            if (!isPlaying) return;
            // Map tilt to rotation targets
            rotationTarget.y = (e.gamma * Math.PI) / 180;
            rotationTarget.x = (e.beta * Math.PI) / 180;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
